<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube zu Mixxx – Einstellungen</title>
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1>YouTube zu Mixxx</h1>
    <form id="settings-form">
      <label for="download-path">Download-Ordner</label>
      <input id="download-path" name="downloadPath" type="text" required spellcheck="false" placeholder="~/Musik/YouTube">
      <p class="hint">Der Ordner muss innerhalb eines in Mixxx eingetragenen Musikordners liegen. Erlaubt sind absolute Pfade und <code>~</code> für dein Home-Verzeichnis.</p>
      <button type="submit">Einstellungen speichern</button>
      <output id="status" aria-live="polite"></output>
    </form>
  </main>
</body>
</html>
